services:
  bot:
    build: .
    image: jira-subtask-bot
    container_name: jira-bot
    command: python3 telegram_bot.py
    env_file: .env
    environment:
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - ./data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
